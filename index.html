<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Hakikat Payı</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b0b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:auto}
h1{font-size:21px;margin:4px 0 14px}
.controls{display:grid;gap:10px}
textarea,input,button{width:100%;font:inherit;border-radius:12px;border:1px solid #363636;background:#171717;color:#fff;padding:13px}
textarea{min-height:125px;resize:vertical}
button{background:#fff;color:#000;border:0;font-weight:750;min-height:50px}
button.secondary{background:#222;color:#fff;border:1px solid #444}
button:disabled{opacity:.45}
#status{font-size:14px;min-height:22px}
.note{font-size:12px;color:#aaa;line-height:1.45}
.preview{margin-top:18px;display:flex;justify-content:center}
canvas,video{display:block;width:min(100%,540px);height:auto;background:#000}
video{display:none;margin:14px auto 0}
#share{display:none;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Hakikat Payı — 15 sn Video</h1>
<div class="controls">
<textarea id="quote" placeholder="Sözü yaz...">İnsanlar, sevdikleri kişiyi incitmek konusunda korktukları kişiyi incitmekten daha az çekinirler.</textarea>
<input id="author" value="Niccolò Machiavelli" placeholder="Yazar / kişi">
<input id="work" value="Prens, XVII" placeholder="Eser / kaynak">
<button id="make">15 saniyelik videoyu oluştur</button>
<div id="status"></div>
<div class="note">Video hazır olduğunda “Paylaş / Galeriye Kaydet” düğmesine bas. iPhone paylaşım menüsünde “Videoyu Kaydet” seçeneğini kullan.</div>
</div>
<div class="preview"><canvas id="canvas" width="1080" height="1080"></canvas></div>
<video id="video" controls playsinline></video>
<button class="secondary" id="share">Paylaş / Galeriye Kaydet</button>
</main>
<script>
const $=s=>document.querySelector(s);
const q=$("#quote"),author=$("#author"),work=$("#work"),canvas=$("#canvas"),ctx=canvas.getContext("2d");
const make=$("#make"),status=$("#status"),video=$("#video"),share=$("#share");
let finalBlob=null, finalFile=null, finalURL=null;

function wrap(text,maxWidth){
  const words=text.trim().split(/\s+/), lines=[]; let line="";
  for(const word of words){
    const t=line?line+" "+word:word;
    if(ctx.measureText(t).width<=maxWidth) line=t;
    else { if(line) lines.push(line); line=word; }
  }
  if(line) lines.push(line);
  return lines;
}
function draw(){
  const W=1080,H=1080;
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="middle";
  const text="“"+q.value.trim()+"”";
  let fs=72, lines=[];
  while(fs>=46){
    ctx.font=`400 ${fs}px Georgia, "Times New Roman", serif`;
    lines=wrap(text,W*.84);
    if(lines.length*fs*1.12 + 170 < H*.72) break;
    fs-=2;
  }
  const lh=fs*1.12, total=lines.length*lh+145;
  let y=(H-total)/2+lh/2;
  ctx.font=`400 ${fs}px Georgia, "Times New Roman", serif`;
  for(const line of lines){ctx.fillText(line,W/2,y);y+=lh}
  y+=50;
  if(author.value.trim()){
    ctx.font='400 36px Georgia, "Times New Roman", serif';
    ctx.fillText("— "+author.value.trim(),W/2,y); y+=50;
  }
  if(work.value.trim()){
    ctx.font='italic 36px Georgia, "Times New Roman", serif';
    ctx.fillText(work.value.trim(),W/2,y);
  }
}
[q,author,work].forEach(x=>x.addEventListener("input",draw)); draw();

function supportedMime(){
  if(!window.MediaRecorder) return null;
  const list=[
    'video/mp4;codecs="avc1.42E01E"',
    "video/mp4",
    'video/webm;codecs="vp8"',
    "video/webm"
  ];
  for(const t of list){
    try{if(MediaRecorder.isTypeSupported(t)) return t}catch(e){}
  }
  return "";
}

async function build(){
  draw();
  if(!window.MediaRecorder || !canvas.captureStream){
    status.textContent="Bu Safari sürümü tarayıcı içinde video oluşturmayı desteklemiyor.";
    return;
  }
  make.disabled=true; share.style.display="none"; video.style.display="none";
  status.textContent="15 saniyelik video hazırlanıyor…";
  const mime=supportedMime();
  const stream=canvas.captureStream(30);
  const chunks=[];
  let rec;
  try{
    rec=mime ? new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000})
             : new MediaRecorder(stream,{videoBitsPerSecond:8000000});
  }catch(e){
    make.disabled=false; status.textContent="Bu cihaz video kaydediciyi başlatamadı."; return;
  }

  rec.ondataavailable=e=>{if(e.data && e.data.size>0) chunks.push(e.data)};
  rec.onstop=async()=>{
    const type=rec.mimeType || mime || "video/mp4";
    finalBlob=new Blob(chunks,{type});
    if(finalURL) URL.revokeObjectURL(finalURL);
    finalURL=URL.createObjectURL(finalBlob);
    video.src=finalURL; video.style.display="block";
    const ext=type.includes("mp4")?"mp4":"webm";
    finalFile=new File([finalBlob],`hakikat-payi-15sn.${ext}`,{type});
    share.style.display="block";
    make.disabled=false;
    status.textContent="Hazır. Süre kontrol ediliyor…";
    video.onloadedmetadata=()=>{
      const d=video.duration;
      status.textContent=Number.isFinite(d) ? `Hazır — video süresi ${d.toFixed(1)} sn.` : "Hazır.";
    };
  };

  rec.start(1000);

  // iOS'ta statik canvas akışının erken bitmesini önlemek için
  // tüm 15 saniye boyunca canvas'a gerçek kareler çiziyoruz.
  const start=performance.now();
  function keepAlive(now){
    draw();
    if(now-start < 15000){
      requestAnimationFrame(keepAlive);
    }else{
      setTimeout(()=>{ if(rec.state!=="inactive") rec.stop(); },120);
    }
  }
  requestAnimationFrame(keepAlive);
}

make.addEventListener("click",build);

share.addEventListener("click",async()=>{
  if(!finalBlob) return;
  try{
    if(navigator.share && finalFile && (!navigator.canShare || navigator.canShare({files:[finalFile]}))){
      await navigator.share({files:[finalFile],title:"Hakikat Payı"});
    }else{
      const a=document.createElement("a");
      a.href=finalURL;
      a.download=finalFile ? finalFile.name : "hakikat-payi-15sn.mp4";
      document.body.appendChild(a); a.click(); a.remove();
      status.textContent="Dosya açıldı/indirildi. iPhone'da Paylaş → Videoyu Kaydet'i kullan.";
    }
  }catch(e){
    if(e && e.name!=="AbortError") status.textContent="Paylaşım açılamadı. Videoya uzun basıp Paylaş seçeneğini kullan.";
  }
});
</script>
</body>
</html>
